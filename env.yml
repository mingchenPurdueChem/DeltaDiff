name: deltadiff
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - mdtraj
  - numpy=1.26
  - pandas=1.5
  - scipy=1.10
  - matplotlib-base
  - seaborn=0.12.2
  - biotite=0.37.0
  - biopython=1.81
  - dm-tree=0.1.8
  - deeptime=0.4.4
  - ml-collections=0.1.1
  - rootutils=1.0.7
  - rich=13.7.0
  - pyyaml
  - scikit-learn
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.6.0+cu118
      - torchvision==0.21.0+cu118
      - torchaudio==2.6.0+cu118
      - torch-geometric==2.7.0
      - torchmetrics==0.11.4
      - lightning==2.1.2
      - pytorch-lightning==2.1.2
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - ase==3.28.0
      - einops==0.8.2
      - tqdm==4.67.3
      - python-dotenv==1.2.2
      - stackprinter==0.2.12
      - torchmd-net @ git+https://github.com/torchmd/torchmd-net.git@2a2c913352a8b5fd297a33dd0ec35c4d69fb1eea
